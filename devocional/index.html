<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Devocional Diário</title>
    <link rel="stylesheet" href="./style.css">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=DM+Sans:wght@400;500;700&display=swap"
        rel="stylesheet">
</head>

<body>

    <div class="app-container">

        <!-- =========================================================
             TELA "HOJE"
        ========================================================== -->
        <section id="todayScreen" class="screen active">

            <header class="today-header">
                <button id="themeToggle" class="theme-toggle" type="button">🌙</button>
                <h1>Devocional Diário</h1>
                <button id="moreButton" class="more-button" type="button">≡</button>
            </header>

            <div class="today-content">

                <div id="devotionalLoading" class="devotional-loading">
                    Preparando seu devocional de hoje...
                </div>

                <div id="devotionalContent" class="hidden">

                    <blockquote id="devotionalQuote" class="devotional-quote"></blockquote>

                    <div class="devotional-passage">
                        <span class="label">PASSAGEM DO DIA</span>
                        <p id="devotionalVerseText" class="devotional-verse-text"></p>
                        <p id="devotionalVerseRef" class="devotional-verse-ref"></p>
                    </div>

                    <div class="devotional-reflection">
                        <h2 id="devotionalTitle"></h2>
                        <div id="devotionalParagraphs"></div>
                    </div>

                </div>

                <div id="devotionalError" class="verse-error hidden"></div>

            </section>

            <div class="today-actions">
                <button id="openPrayerButton" class="action-button" type="button">
                    <span class="icon">🙏</span>
                    <span>Oração</span>
                </button>
                <button id="openNoteButton" class="action-button" type="button">
                    <span class="icon">📝</span>
                    <span>Reflexão</span>
                </button>
            </div>

        </section>

        <!-- =========================================================
             TELA "BÍBLIA"
        ========================================================== -->
        <section id="bibleScreen" class="screen">

            <header class="section-header">
                <h1>Bíblia</h1>
                <button id="randomVerseButton" class="icon-button" type="button">🎲</button>
            </header>

            <div class="bible-controls">
                <select id="bookSelect" class="select-input"></select>
                <select id="chapterSelect" class="select-input"></select>
            </div>

            <div id="chapterContent" class="chapter-content"></div>

        </section>

        <!-- =========================================================
             TELA "BUSCAR"
        ========================================================== -->
        <section id="searchScreen" class="screen">

            <header class="section-header">
                <h1>Buscar</h1>
            </header>

            <div class="search-container">
                <input id="searchInput" class="search-input" type="text" placeholder="Digite sua busca...">
                <button id="searchButton" class="primary-button" type="button">Buscar</button>
            </div>

            <div id="searchResults" class="search-results"></div>

        </section>

        <!-- =========================================================
             TELA "CAMINHO" (Path / Journey)
        ========================================================== -->
        <section id="pathScreen" class="screen">

            <header class="section-header">
                <h1>Meu Caminho</h1>
            </header>

            <div class="path-tabs">
                <button id="favoritesTabButton" class="tab-button active" data-tab="favorites"
                    type="button">Favoritos</button>
                <button id="reflectionsTabButton" class="tab-button" data-tab="reflections"
                    type="button">Reflexões</button>
            </div>

            <div id="favoritesTab" class="tab-content active">
                <div id="favoritesList" class="verses-list"></div>
            </div>

            <div id="reflectionsTab" class="tab-content">
                <div id="reflectionsList" class="reflections-list"></div>
            </div>

        </section>

        <!-- =========================================================
             TELA "MAIS"
        ========================================================== -->
        <section id="moreScreen" class="screen">

            <header class="section-header">
                <h1>Mais</h1>
            </header>

            <div class="more-options">
                <button id="aboutButton" class="more-option-button" type="button">
                    <span class="icon">ℹ️</span>
                    <span>Sobre</span>
                </button>
                <button id="clearDataButton" class="more-option-button danger" type="button">
                    <span class="icon">🗑️</span>
                    <span>Limpar dados</span>
                </button>
            </div>

        </section>

        <!-- =========================================================
             NAVEGAÇÃO INFERIOR
        ========================================================== -->
        <nav class="bottom-nav">
            <button class="nav-button active" data-screen="todayScreen" type="button">
                <span class="icon">📖</span>
                <span>Hoje</span>
            </button>
            <button class="nav-button" data-screen="bibleScreen" type="button">
                <span class="icon">✝️</span>
                <span>Bíblia</span>
            </button>
            <button class="nav-button" data-screen="searchScreen" type="button">
                <span class="icon">🔍</span>
                <span>Buscar</span>
            </button>
            <button class="nav-button" data-screen="pathScreen" type="button">
                <span class="icon">🛤️</span>
                <span>Caminho</span>
            </button>
            <button class="nav-button" data-screen="moreScreen" type="button">
                <span class="icon">⋯</span>
                <span>Mais</span>
            </button>
        </nav>

    </div>

    <!-- =========================================================
         MODAL DE ORAÇÃO
    ========================================================== -->
    <div id="prayerModal" class="modal hidden">
        <div class="modal-content">
            <button id="closePrayerModal" class="close" type="button">×</button>

            <span class="section-label">ORAÇÃO DO DIA</span>
            <h2>Como posso orar hoje?</h2>

            <textarea id="prayerInput" placeholder="Escreva sua oração..."></textarea>

            <button id="savePrayerButton" class="primary-button" type="button">Enviar oração</button>

            <div class="prayer-footer">
                <strong>Amém. 🤍</strong>
            </div>
        </div>
    </div>

    <!-- =========================================================
         MODAL DE ANOTAÇÃO
    ========================================================== -->
    <div id="noteModal" class="modal hidden">
        <div class="modal-content">
            <button id="closeNoteModal" class="close" type="button">×</button>

            <span class="section-label">MEU DIÁRIO</span>
            <h2>O que Deus falou com você?</h2>

            <textarea id="noteInput" placeholder="Escreva aqui sua reflexão..."></textarea>

            <button id="saveNoteButton" class="primary-button" type="button">Salvar reflexão</button>
        </div>
    </div>

    <!-- JAVASCRIPT -->
    <script src="./script.js"></script>

</body>

</html>
